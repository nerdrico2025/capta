services:
  postgres:
    image: postgres:16-alpine
    container_name: capta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: capta
      POSTGRES_PASSWORD: capta
      POSTGRES_DB: capta
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capta']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capta_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: capta_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://capta:capta@postgres:5432/capta
      REDIS_URL: redis://redis:6379
      PORT: '3001'
      HOST: '0.0.0.0'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: capta_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
